spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect
  
  h2:
    console:
      enabled: true

logging:
  level:
    org.springframework.web: DEBUG
    com.example.wakeupmate: DEBUG
    
# 테스트용 메모리
test:
  memory:
    initial-heap: 128m
    max-heap: 512m 